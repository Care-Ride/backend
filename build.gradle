plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'
	implementation 'org.apache.commons:commons-lang3:3.18.0'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Google oauth
	implementation "com.google.auth:google-auth-library-oauth2-http:1.40.0"
	implementation 'io.opencensus:opencensus-api:0.31.1'
	implementation 'io.opencensus:opencensus-impl:0.31.1'

	// REDIS
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// WebClient
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Apache HttpClient
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'

	// JTS (Geo)
	implementation 'org.locationtech.jts:jts-core:1.19.0'
	implementation 'org.locationtech.jts.io:jts-io-common:1.19.0'

	// S3
	implementation 'software.amazon.awssdk:s3:2.39.6'
	implementation 'software.amazon.awssdk:auth:2.39.6'
	implementation 'software.amazon.awssdk:regions:2.39.6'
}

jar {
	enabled = false
}
jar {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}
